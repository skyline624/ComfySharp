name: SD native-origin diagnostic (isolated Linux)
on:
  push:
    paths:
      - '.github/workflows/sd-native-diagnostic.yml'
      - 'labs/sd-native-diagnostic/**'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Prepare unchanged hashed CPU laboratory
        shell: pwsh
        run: |
          $laboratory = Join-Path $env:RUNNER_TEMP 'sd-native-python'
          python -m venv $laboratory
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create isolated laboratory.' }
          $interpreter = Join-Path $laboratory 'bin/python'
          & $interpreter -I -m pip --isolated --disable-pip-version-check install --no-cache-dir --require-hashes --only-binary=:all: -r 'labs/clip-source/requirements-linux-x64.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Hashed CPU laboratory restore failed.' }
          & $interpreter -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Laboratory dependency closure is inconsistent.' }
      - name: Fetch pinned U-Net source snapshot subset
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'sd-native-snapshot'
          $files = @{
            'comfy/ldm/modules/diffusionmodules/util.py' = 'fb58652a35521fc23bdcb75d91adace8e4cc79e2d5b13af1617a38d0c0f7142e'
            'comfy/ldm/modules/attention.py' = '9cafaafaf93ff53e8cbefb5e4a204014019985df2da8c1996bf40f1235fc2960'
            'comfy/ldm/modules/diffusionmodules/openaimodel.py' = '9d27fb036cab8a262ef3d866a643f7fdc40994022616f1b8be14b7d919f57f96'
          }
          foreach ($relative in $files.Keys) {
            $target = Join-Path $snapshot $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/comfy-org/ComfyUI/1d48d9cf7bcecb6022a87b3cb13e0fb435bf9b8a/$relative" -OutFile $target
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $files[$relative]) {
              throw "Frozen source hash mismatch: $relative"
            }
          }
      - name: Restore locked product test dependencies
        run: dotnet restore tests/ComfySharp.Inference.Tests --locked-mode -p:NativeRuntime=linux-x64
      - name: Build product tests once
        run: dotnet build tests/ComfySharp.Inference.Tests --no-restore -c Release -p:NativeRuntime=linux-x64
      - name: Capture six independent native-origin processes
        shell: pwsh
        run: |
          $interpreter = Join-Path $env:RUNNER_TEMP 'sd-native-python/bin/python'
          & $interpreter -I -B 'labs/sd-native-diagnostic/run.py' --source-directory (Join-Path $env:RUNNER_TEMP 'sd-native-snapshot') --output (Join-Path $env:RUNNER_TEMP 'sd-native-diagnostic')
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic retained an execution, committed-test, or integrity failure; inspect artifacts.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sd-native-auto-linux-x64
          path: ${{ runner.temp }}/sd-native-diagnostic/auto
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sd-native-default-linux-x64
          path: ${{ runner.temp }}/sd-native-diagnostic/default
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sd-native-control-linux-x64
          path: ${{ runner.temp }}/sd-native-diagnostic/*.json
          if-no-files-found: warn
