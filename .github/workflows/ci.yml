name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-14
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore ComfySharp.slnx --locked-mode -p:NativeRuntime=${{ matrix.runtime }}
      - name: Build
        run: dotnet build ComfySharp.slnx --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }}
      - name: Test Core, Workflow, Tokenization, Desktop headless and Host contracts
        shell: pwsh
        run: |
          $failedProjects = @()
          foreach ($project in @('Core', 'Workflow', 'Tokenization', 'Desktop', 'Host', 'NativeBundle')) {
            & dotnet test "tests/ComfySharp.$project.Tests" --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --logger trx --results-directory "TestResults/$project"
            if ($LASTEXITCODE -ne 0) { $failedProjects += $project }
          }
          if ($failedProjects.Count) { throw "Application contract projects failed: $($failedProjects -join ', ')" }
      - name: Check catalogue consistency
        run: dotnet run --no-build -c Release --project tools/ComfySharp.Catalog -- docs/capabilities/manifest.json --node-evidence docs/capabilities/node-registration.json docs/capabilities/node-schemas.json
      - name: Start native Desktop and its supervised Host
        timeout-minutes: 3
        shell: pwsh
        run: |
          $desktop = Join-Path $env:GITHUB_WORKSPACE 'src/ComfySharp.Desktop/bin/Release/net10.0/ComfySharp.Desktop.dll'
          if ($IsLinux) {
            $output = & xvfb-run -a -s '-screen 0 1280x800x24' dotnet $desktop --smoke-test 2>&1
          } else {
            $output = & dotnet $desktop --smoke-test 2>&1
          }
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0 -or ($output -join "`n") -notmatch 'ComfySharp Desktop smoke passed:') {
            throw "Native Desktop / Host smoke did not complete (exit $exitCode)."
          }
      - name: Exercise IMAGE operations and source references in a separate CPU process
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~ImageOperationsTests|FullyQualifiedName~ImageNodeTests|FullyQualifiedName~ImagePrimitiveSourceReferenceTests|FullyQualifiedName~ImageBatchOperationsTests|FullyQualifiedName~ImageBatchNodeTests|FullyQualifiedName~ImageBatchSourceReferenceTests|FullyQualifiedName~ImagePngEncoderTests|FullyQualifiedName~ImageFileNodeTests' --logger trx --results-directory ImageResults
      - name: Exercise SD1.5 checkpoint assembly contracts
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~Sd15CheckpointAssemblyTests|FullyQualifiedName~Sd15CheckpointPlanTests' --logger trx --results-directory CheckpointResults
      - name: Exercise reduced SD1.5 pipeline contracts
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~Sd15Pipeline&FullyQualifiedName!~Sd15PipelineReferenceTests' --logger trx --results-directory PipelineResults
      - name: Exercise safetensors export and SaveLoRA contracts
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~SafeTensorWriterTests|FullyQualifiedName~SaveLoraNodeTests|FullyQualifiedName~LoraTrainingStateTests|FullyQualifiedName~NativeLoraTensorSourceTests|FullyQualifiedName~LoraModelLoaderNodeTests|FullyQualifiedName~LoraBypassTests|FullyQualifiedName~SdLoraBypassTests' --logger trx --results-directory TestResults/SaveLoRA
      - name: Exercise training bypass source and dataset contracts
        # Keep the bypass source/loop cases observable even when another numerical gate fails later.
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~LoraTrainingBypassTests|FullyQualifiedName~SdTrainingLoopTests' --logger trx --results-directory TestResults/TrainingBypass
      - name: Exercise all-target adapter initialization and mixed gradients
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~SdAdapterInitializationTests|FullyQualifiedName~TrainableAdapterTests|FullyQualifiedName~TrainingReferenceCorpusTests' --logger trx --results-directory TestResults/TrainingAdapters
      - name: Exercise training datasets, source RNG and training loops
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~SdTraining' --logger trx --results-directory TestResults/TrainingDatasets
      - name: Exercise sampler trajectories, inpaint masks and LoRA foundations
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName~SdHeunSamplerTests|FullyQualifiedName~SdKarrasScheduleTests|FullyQualifiedName~SdSchedulerTests|FullyQualifiedName~SdDpmpp2MSamplerTests|FullyQualifiedName~SdInpaintMaskTests|FullyQualifiedName~LoraMathTests|FullyQualifiedName~LoraWeightPatchTests|FullyQualifiedName~LoraFileLoaderTests|FullyQualifiedName~LoraDifferenceTests|FullyQualifiedName~LoraModelAliasesTests|FullyQualifiedName~LoraNodeTests|FullyQualifiedName~LoraTrainingTests|FullyQualifiedName~LoraOptimizerTests|FullyQualifiedName~SdLoraObjectiveTests' --logger trx --results-directory TestResults/Heun
      - name: Exercise reference fixtures as the first native access in separate processes
        id: native_first_use
        shell: pwsh
        env:
          COMFYSHARP_SD_UNET_TRACE_DIR: ${{ github.workspace }}/SdTraces/${{ matrix.runtime }}
          COMFYSHARP_SD_EULER_TRACE_DIR: ${{ github.workspace }}/EulerTraces/${{ matrix.runtime }}
          COMFYSHARP_SD15_PIPELINE_TRACE_DIR: ${{ github.workspace }}/PipelineSourceTraces/${{ matrix.runtime }}
        run: |
          $failedSuites = @()
          foreach ($suite in @('PreviewAnyReferenceTests', 'SigmaScheduleReferenceTests', 'ClipReferenceTests',
              'SdSamplingReferenceTests', 'SdUnetReferenceTests', 'ClassicalVaeReferenceTests', 'SdDenoiserReferenceTests', 'SdEulerReferenceTests', 'Sd15PipelineReferenceTests')) {
            & dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter "FullyQualifiedName~$suite" --logger trx --results-directory "FirstUseResults/$suite"
            if ($LASTEXITCODE -ne 0) { $failedSuites += $suite }
          }
          if ($failedSuites.Count) { throw "Native first-use reference suites failed: $($failedSuites -join ', ')" }
      - name: Test inference contracts and CPU primitives
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter 'FullyQualifiedName!~ClipStockReferenceTests' --logger trx --results-directory TestResults/Inference
      - name: Inspect a safetensors file in a fresh process without libtorch
        shell: pwsh
        run: |
          $inspector = Join-Path $env:GITHUB_WORKSPACE 'tools/ComfySharp.ModelInspect/bin/Release/net10.0/ComfySharp.ModelInspect.dll'
          $nativeCore = Get-ChildItem -LiteralPath (Split-Path -Parent $inspector) -File -Recurse | Where-Object Name -Match '^(lib)?torch_cpu\.(dll|so|dylib)$'
          if ($nativeCore) { throw 'Metadata inspector unexpectedly contains native libtorch.' }
          $output = & dotnet $inspector 'tests/ComfySharp.Inference.Tests/Fixtures/metadata-contract.safetensors' --sha256
          if ($LASTEXITCODE -ne 0) { throw 'Metadata inspection failed.' }
          $report = $output | ConvertFrom-Json
          $output | Write-Output
          if ($report.status -ne 'ok' -or $report.tensorCount -ne 2 -or $report.weightCompatibility -ne 'not_assessed' -or
              $report.sha256 -ne '2d8ae1aabaeaad341c2fc30cfd9af025506805fb6e83a70c3be61dbec952c47a') {
            throw 'Metadata inspection did not reproduce the fixture contract.'
          }
      # The text tokenizer is exercised separately so its embedded resources and
      # dependency isolation are checked outside a testhost and tensor runtime.
      - name: Tokenize CLIP text in a fresh process without libtorch
        shell: pwsh
        run: |
          $cli = Join-Path $env:GITHUB_WORKSPACE 'tools/ComfySharp.Tokenize/bin/Release/net10.0/ComfySharp.Tokenize.dll'
          $torch = Get-ChildItem -LiteralPath (Split-Path -Parent $cli) -File -Recurse | Where-Object Name -Match 'torch'
          if ($torch) { throw 'Text tokenizer unexpectedly contains Torch dependencies.' }
          $output = & dotnet $cli --text a --profile sdxl
          if ($LASTEXITCODE -ne 0) { throw 'CLIP text diagnostic failed.' }
          $report = $output | ConvertFrom-Json
          if ($report.status -ne 'ok' -or ($report.ids -join ',') -ne '49406,320,49407' -or
              $report.outputs.g[0].Count -ne 77 -or $report.outputs.g[0][76].id -ne 0 -or
              $report.outputs.l[0][76].id -ne 49407 -or $report.modelCompatibility -ne 'not_assessed') {
            throw 'CLIP text diagnostic did not reproduce the source contract.'
          }
          Write-Output 'CLIP text diagnostic passed: exact IDs, SDXL G/L padding, no Torch dependencies.'
      - name: Inspect CLIP metadata without native payload and encode a synthetic fixture
        shell: pwsh
        run: |
          $directory = Join-Path $env:GITHUB_WORKSPACE 'tools/ComfySharp.RuntimeProbe/bin/native/${{ matrix.runtime }}/cpu/Release/net10.0'
          $managedOnly = Join-Path $env:RUNNER_TEMP 'comfysharp-clip-inspection'
          New-Item -ItemType Directory -Path $managedOnly -Force | Out-Null
          $nativePattern = '^(lib)?(LibTorchSharp|torch_cpu|torch|c10|libomp|shm)\.(dll|so|dylib)$'
          Get-ChildItem -LiteralPath $directory -File | Where-Object {
            $_.Name -notmatch $nativePattern -and ($_.Extension -eq '.dll' -or $_.Name -match '\.(deps|runtimeconfig)\.json$')
          } | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $managedOnly }
          if (Get-ChildItem -LiteralPath $managedOnly -File -Recurse | Where-Object Name -Match $nativePattern) {
            throw 'Managed-only CLIP inspection unexpectedly contains a tensor native library.'
          }
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'tests/ComfySharp.Inference.Tests/Fixtures/clip-tiny-l.synthetic.safetensors'
          $cli = Join-Path $managedOnly 'ComfySharp.RuntimeProbe.dll'
          $result = & dotnet $cli clip --weights $fixture --layout canonical --profile sd1-l --synthetic-config '8,20,3,2,quick_gelu' --inspect --sha256
          if ($LASTEXITCODE -ne 0) { throw 'Managed-only CLIP inspection failed.' }
          $report = $result | ConvertFrom-Json
          if ($report.status -ne 'ok' -or $report.nativeInitialized -ne $false -or $report.weightPlan.tensorCount -ne 53 -or
              $report.fileSha256 -ne '702aff7540e0b417a9f81a36c3978d0e424006baf44d8fcc29f6e79bd8490e1c') {
            throw 'Managed-only CLIP metadata contract differs.'
          }
          $cli = Join-Path $directory 'ComfySharp.RuntimeProbe.dll'
          $result = & dotnet $cli clip --weights $fixture --layout canonical --profile sd1-l --synthetic-config '8,20,3,2,quick_gelu' --text 'a (cat:1.5)' --repeat 3
          if ($LASTEXITCODE -ne 0) { throw 'CLIP encoding diagnostic failed.' }
          $report = $result | ConvertFrom-Json
          if ($report.status -ne 'ok' -or $report.synthetic -ne $true -or $report.nativeInitialized -ne $true -or
              $report.outputHashesRepeat -ne $true -or $report.modelCompatibility -ne 'not_assessed' -or
              ($report.executions[0].hidden.shape -join ',') -ne '1,77,8') {
            throw 'CLIP diagnostic did not execute the expected synthetic graph.'
          }
          Write-Output 'CLIP inspection without native payload and repeated synthetic conditioning passed; no pretrained compatibility claimed.'
      - name: Exercise actual native CPU operations
        run: dotnet run --no-build -c Release --project tools/ComfySharp.RuntimeProbe -- --device cpu --repeat 25
      - name: Compare full CLIP L and G dimensions in a separate CPU process
        id: clip_stock
        timeout-minutes: 6
        env:
          COMFYSHARP_CLIP_TRACE_DIR: ${{ github.workspace }}/StockTraces/${{ matrix.runtime }}
        run: dotnet test tests/ComfySharp.Inference.Tests --no-build --no-restore -c Release -p:NativeRuntime=${{ matrix.runtime }} --filter FullyQualifiedName~ClipStockReferenceTests --logger trx --results-directory StockResults
      - name: Diagnose macOS native loader failures
        if: failure() && matrix.runtime == 'osx-arm64'
        shell: bash
        run: |
          otool -L "$HOME/.nuget/packages/torchsharp/0.107.0/runtimes/osx-arm64/native/libLibTorchSharp.dylib"
          otool -L "$HOME/.nuget/packages/libtorch-cpu-osx-arm64/2.10.0/runtimes/osx-arm64/native/libtorch_cpu.dylib"
          native_dir="$PWD/tests/ComfySharp.Inference.Tests/bin/native/osx-arm64/cpu/Release/net10.0/runtimes/osx-arm64/native"
          dotnet run --no-build -c Release --project tools/ComfySharp.NativeLoader -- "$native_dir/libomp.dylib" "$native_dir/libLibTorchSharp.dylib"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-image-${{ matrix.runtime }}
          path: ImageResults
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-checkpoint-${{ matrix.runtime }}
          path: CheckpointResults
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-pipeline-${{ matrix.runtime }}
          path: PipelineResults
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (steps.native_first_use.outcome == 'success' || steps.native_first_use.outcome == 'failure' || steps.native_first_use.outcome == 'cancelled')
        with:
          name: sd15-pipeline-traces-${{ matrix.runtime }}
          path: PipelineSourceTraces
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ matrix.runtime }}
          path: TestResults
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (steps.native_first_use.outcome == 'success' || steps.native_first_use.outcome == 'failure' || steps.native_first_use.outcome == 'cancelled')
        with:
          name: sd-euler-traces-${{ matrix.runtime }}
          path: EulerTraces
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-first-use-${{ matrix.runtime }}
          path: FirstUseResults
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-stock-${{ matrix.runtime }}
          path: StockResults
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (steps.clip_stock.outcome == 'success' || steps.clip_stock.outcome == 'failure' || steps.clip_stock.outcome == 'cancelled')
        with:
          name: clip-stock-traces-${{ matrix.runtime }}
          path: StockTraces
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sd-component-traces-${{ matrix.runtime }}
          path: SdTraces
          if-no-files-found: ignore
