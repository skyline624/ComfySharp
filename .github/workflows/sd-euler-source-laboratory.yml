name: Prospective Euler source laboratory
on:
  push:
    paths:
      - 'labs/sd-euler-source/**'
      - '.github/workflows/sd-euler-source-laboratory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-14
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve canonical repository bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Restore unchanged locked CPU environment
        shell: pwsh
        run: |
          $laboratory = Join-Path $env:RUNNER_TEMP 'sd-euler-python'
          python -m venv $laboratory
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create laboratory environment.' }
          $interpreter = if ($IsWindows) { Join-Path $laboratory 'Scripts/python.exe' } else { Join-Path $laboratory 'bin/python' }
          & $interpreter -I -m pip --isolated --disable-pip-version-check install --no-cache-dir --require-hashes --only-binary=:all: -r 'labs/clip-source/requirements-${{ matrix.runtime }}.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Hashed CPU environment restore failed.' }
          & $interpreter -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency closure check failed.' }
      - name: Fetch the prospectively pinned source blobs
        shell: pwsh
        run: |
          $protocol = Get-Content -LiteralPath 'labs/sd-euler-source/protocol.json' -Raw | ConvertFrom-Json -AsHashtable
          $snapshot = Join-Path $env:RUNNER_TEMP 'sd-euler-snapshot'
          foreach ($relative in $protocol.sources.Keys) {
            $target = Join-Path $snapshot $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/comfy-org/ComfyUI/$($protocol.backendCommit)/$relative" -OutFile $target
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $protocol.sources[$relative]) {
              throw "Frozen source hash mismatch: $relative"
            }
          }
      - name: Collect eight prospective source trajectories
        shell: pwsh
        run: |
          $laboratory = Join-Path $env:RUNNER_TEMP 'sd-euler-python'
          $interpreter = if ($IsWindows) { Join-Path $laboratory 'Scripts/python.exe' } else { Join-Path $laboratory 'bin/python' }
          $snapshot = Join-Path $env:RUNNER_TEMP 'sd-euler-snapshot'
          $output = Join-Path $env:RUNNER_TEMP 'sd-euler-evidence'
          & $interpreter -I -B 'labs/sd-euler-source/reference.py' --source-directory $snapshot --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Prospective Euler source collection failed.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Collection modified a tracked repository input.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sd-euler-source-torch210-${{ matrix.runtime }}
          path: ${{ runner.temp }}/sd-euler-evidence
          if-no-files-found: error
