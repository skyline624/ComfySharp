name: Diagnose Linux training source divergence
on:
  push:
    paths:
      - 'labs/training-trace/**'
      - '.github/workflows/training-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: comfy-org/ComfyUI
          ref: 1d48d9cf7bcecb6022a87b3cb13e0fb435bf9b8a
          path: upstream-source
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Verify unchanged source laboratory inputs
        run: python -I -S -B labs/training-platform-source/collect.py --source upstream-source --validate-only
      - name: Prepare locked CPU laboratory and collect source controls
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/training-trace-python"
          "$RUNNER_TEMP/training-trace-python/bin/python" -I -m pip --isolated --disable-pip-version-check install --no-cache-dir --require-hashes --only-binary=:all: -r labs/clip-source/requirements-linux-x64.txt
          "$RUNNER_TEMP/training-trace-python/bin/python" -I -B labs/training-trace/source.py --source upstream-source --output TrainingTrace/source
          lscpu --json > TrainingTrace/cpu.json
      - run: dotnet restore tests/ComfySharp.Inference.Tests --locked-mode -p:NativeRuntime=linux-x64
      - run: dotnet build tests/ComfySharp.Inference.Tests -c Release --no-restore -p:NativeRuntime=linux-x64
      - name: Original checks without observation
        id: baseline
        continue-on-error: true
        run: dotnet test tests/ComfySharp.Inference.Tests -c Release --no-build --no-restore -p:NativeRuntime=linux-x64 --filter FullyQualifiedName~SdAdapterInitializationTests --logger trx --results-directory TrainingTrace/tests-baseline
      - name: Observe original checks with default inter-op pool
        id: observed
        continue-on-error: true
        env:
          COMFYSHARP_TRAINING_TRACE_DIR: ${{ github.workspace }}/TrainingTrace/dotnet-default
        run: dotnet test tests/ComfySharp.Inference.Tests -c Release --no-build --no-restore -p:NativeRuntime=linux-x64 --filter FullyQualifiedName~SdAdapterInitializationTests --logger trx --results-directory TrainingTrace/tests-default
      - name: Observe original checks with one inter-op thread
        id: interop
        continue-on-error: true
        env:
          COMFYSHARP_TRAINING_TRACE_DIR: ${{ github.workspace }}/TrainingTrace/dotnet-interop-one
          COMFYSHARP_TRAINING_INTEROP_ONE: '1'
        run: dotnet test tests/ComfySharp.Inference.Tests -c Release --no-build --no-restore -p:NativeRuntime=linux-x64 --filter FullyQualifiedName~SdAdapterInitializationTests --logger trx --results-directory TrainingTrace/tests-interop-one
      - name: Compare captured tensors without altering test verdicts
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B labs/training-trace/compare.py --source TrainingTrace/source --actual TrainingTrace/dotnet-default --output TrainingTrace/comparison-default.json
          python -I -S -B labs/training-trace/compare.py --source TrainingTrace/source --actual TrainingTrace/dotnet-interop-one --output TrainingTrace/comparison-interop-one.json
      - name: Verify mixed file contracts independently of the failing gradient cases
        id: mixed
        continue-on-error: true
        run: dotnet test tests/ComfySharp.Inference.Tests -c Release --no-build --no-restore -p:NativeRuntime=linux-x64 --filter 'FullyQualifiedName~LoraDifferenceTests|FullyQualifiedName~LoraModelAliasesTests' --logger trx --results-directory TrainingTrace/tests-mixed
      - name: Verify tracked sources remained unchanged
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-training-trace
          path: TrainingTrace
          if-no-files-found: error
      - name: Preserve failed reference verdicts
        if: always() && (steps.baseline.outcome == 'failure' || steps.observed.outcome == 'failure' || steps.interop.outcome == 'failure' || steps.mixed.outcome == 'failure')
        run: echo 'Reference checks failed; diagnostic artifacts do not qualify the implementation.' && exit 1
