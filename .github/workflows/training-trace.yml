name: Compare Linux native training candidate
on:
  push:
    paths:
      - 'labs/training-trace/**'
      - '.github/workflows/training-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: comfy-org/ComfyUI
          ref: 1d48d9cf7bcecb6022a87b3cb13e0fb435bf9b8a
          path: upstream-source
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Verify unchanged source laboratory inputs
        run: python -I -S -B labs/training-platform-source/collect.py --source upstream-source --validate-only
      - name: Prepare locked CPU laboratory and collect source controls
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/training-trace-python"
          "$RUNNER_TEMP/training-trace-python/bin/python" -I -m pip --isolated --disable-pip-version-check install --no-cache-dir --require-hashes --only-binary=:all: -r labs/clip-source/requirements-linux-x64.txt
          "$RUNNER_TEMP/training-trace-python/bin/python" -I -B labs/training-trace/source.py --source upstream-source --output TrainingTrace/source
          lscpu --json > TrainingTrace/cpu.json
      - run: dotnet restore tests/ComfySharp.Inference.Tests --locked-mode -p:NativeRuntime=linux-x64
      - name: Build the native identity bridge with the matching SDK
        shell: bash
        run: |
          set -euo pipefail
          torchSdk=$("$RUNNER_TEMP/training-trace-python/bin/python" -I -c 'import importlib.metadata; print(importlib.metadata.distribution("torch").locate_file("torch"))')
          cmake -S native/ComfySharp.NativeGenerator -B "$RUNNER_TEMP/native-runtime-identity" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$torchSdk"
          cmake --build "$RUNNER_TEMP/native-runtime-identity" --config Release --parallel 2
      - run: dotnet build tests/ComfySharp.Inference.Tests -c Release --no-restore -p:NativeRuntime=linux-x64 -p:NativeGeneratorBridge=${{ runner.temp }}/native-runtime-identity/libComfySharp.Native.so
      - name: Compare independent native copies with the same-host source
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/training-trace-python/bin/python" -I -B labs/training-trace/native_candidate.py \
            --source-evidence "$GITHUB_WORKSPACE/TrainingTrace/source" \
            --output "$RUNNER_TEMP/training-native-evidence" --staging "$RUNNER_TEMP/training-native-copies"
      - name: Verify tracked sources remained unchanged
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-training-native-candidate
          path: |
            TrainingTrace
            ${{ runner.temp }}/training-native-evidence
          if-no-files-found: error
